name: "type-api-service"
services:
  typesense:
    image: typesense/typesense:0.25.1
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
    command: '--data-dir /data --api-key=${TYPESENSE_KEY} --enable-cors'
    logging:  
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
  typeapi:
    image: ghcr.io/fc4e-t4-3/dtr-toolkit:latest
    container_name: type-api
    restart: on-failure
    ports: 
      - "8080:8080"
    environment:
      - "SPRING_PROFILES_ACTIVE=${ENV}"
      - "TYPESENSE_URL=typesense"
      - "TYPESENSE_KEY=${TYPESENSE_KEY}"
      - "TYPESENSE_PORT=8108"
    depends_on:
      - typesense
    logging:  
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
